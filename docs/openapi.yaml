      parameters: [ { $ref: '#/components/parameters/BuildId' } ]
      responses: { '200': { description: OK } }
  /builds/{id}/scheduled-tasks/{taskId}/cancel:
    post:
      tags: [Schedule]
      summary: Cancel a scheduled task (manage).
      parameters:
        - { $ref: '#/components/parameters/BuildId' }
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: OK } }

