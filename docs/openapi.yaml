    post: { tags: [Builders], summary: Create a builder config (admin)., parameters: [ { name: name, in: path, required: true, schema: { type: string } } ], responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' } } }
    put: { tags: [Builders], summary: Update a builder config (admin)., parameters: [ { name: name, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
    delete: { tags: [Builders], summary: Delete a builder config (admin)., parameters: [ { name: name, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /builder-configs/{name}/available-images:
    get: { tags: [Builders], summary: Live-discover the images on the builder's hoster (admin)., parameters: [ { name: name, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /builder-configs/{name}/image-builds:
