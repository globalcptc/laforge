AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LaForge AWS builder IAM: a runner policy (attached to an IAM user you enroll in
  the LaForge wizard) and the ECS task execution role Fargate requires. Deploy this
  once per account, then paste the Outputs into the builder wizard. Deploy with
  CAPABILITY_NAMED_IAM. This stack creates NO access key -- create one for the
  runner user in the IAM console and paste it into the wizard, so the secret never
  lives in a CloudFormation output.

Parameters:
  RunnerUserName:
    Type: String
    Default: laforge-runner
    Description: IAM user LaForge authenticates as (you create its access key afterward).

Resources:
  # Fargate assumes this to pull container images and ship task logs. Its ARN goes
  # in the wizard's "Task Execution Role ARN" field.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RunnerUserName}-ecs-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Everything the LaForge runner itself calls. EC2 networking actions can't be
  # resource-scoped, so they are account-wide but confined to this stack's region.
  RunnerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RunnerUserName}-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LaForgeEC2
            Effect: Allow
            Action:
              - ec2:DescribeVpcs
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:AssociateVpcCidrBlock
              - ec2:DescribeSubnets
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:DescribeInternetGateways
              - ec2:CreateInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:DescribeRouteTables
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:DescribeNetworkAcls
              - ec2:CreateNetworkAcl
              - ec2:DeleteNetworkAcl
              - ec2:CreateNetworkAclEntry
              - ec2:DeleteNetworkAclEntry
              - ec2:ReplaceNetworkAclAssociation
              - ec2:DescribeSecurityGroups
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:DescribeInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:RebootInstances
              - ec2:CreateTags
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
              - ec2:DescribeAddresses
              - ec2:DescribeRegions
              - ec2:DescribeImages
              - ec2:DescribeInstanceTypes
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: LaForgeECS
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:DeregisterTaskDefinition
              - ecs:ListTaskDefinitions
              - ecs:RunTask
              - ecs:StopTask
              - ecs:DescribeClusters
              - ecs:CreateCluster
              - ecs:TagResource
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: LaForgePassExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt TaskExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Sid: LaForgeIdentityCheck
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - iam:SimulatePrincipalPolicy  # powers the connect-time pre-flight permission check
            Resource: '*'

  RunnerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref RunnerUserName
      ManagedPolicyArns:
        - !Ref RunnerPolicy

Outputs:
  RunnerUser:
    Description: Create an access key for this IAM user and paste it into the wizard's AWS Credentials step.
    Value: !Ref RunnerUser
  ExecutionRoleArn:
    Description: Paste into the wizard's "Task Execution Role ARN" field.
    Value: !GetAtt TaskExecutionRole.Arn
