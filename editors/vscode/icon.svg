<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LaForge">
  <defs>
    <!-- deep-space background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1552"/>
      <stop offset="0.55" stop-color="#1a1c46"/>
      <stop offset="1" stop-color="#0d1a3a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- the VISOR lens: full CPTC sweep, blue -> blue-mid -> purple -> red -> coral -->
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4e9f"/>
      <stop offset="0.26" stop-color="#4c63b0"/>
      <stop offset="0.5" stop-color="#8e3f7a"/>
      <stop offset="0.76" stop-color="#ed2330"/>
      <stop offset="1" stop-color="#fd9493"/>
    </linearGradient>
    <!-- brushed-metal visor frame -->
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="0.5" stop-color="#9aa7bd"/>
      <stop offset="1" stop-color="#5c6880"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- forge ember glow -->
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6df"/>
      <stop offset="0.4" stop-color="#fd9493"/>
      <stop offset="1" stop-color="#ed2330" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- inner lens shape, reused as clip for striations -->
    <path id="lensPath" d="M118 256
      C118 230 146 219 188 217 L324 217
      C366 219 394 230 394 256
      C394 282 366 293 324 295 L188 295
      C146 293 118 282 118 256 Z"/>
    <clipPath id="lensClip"><use href="#lensPath"/></clipPath>
  </defs>

  <!-- badge background -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#bg)"/>

  <!-- faint starfield -->
  <g fill="#ffffff">
    <circle cx="96" cy="120" r="2.4" opacity="0.8"/>
    <circle cx="150" cy="86" r="1.5" opacity="0.5"/>
    <circle cx="410" cy="110" r="2" opacity="0.7"/>
    <circle cx="372" cy="150" r="1.3" opacity="0.45"/>
    <circle cx="430" cy="360" r="1.6" opacity="0.5"/>
    <circle cx="86" cy="330" r="1.6" opacity="0.5"/>
    <circle cx="256" cy="72" r="1.4" opacity="0.5"/>
    <circle cx="120" cy="420" r="1.4" opacity="0.4"/>
  </g>

  <!-- LCARS corner elbows -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 150 L60 92 C60 74 74 60 92 60 L168 60"
          stroke="#fd9493" stroke-width="16" opacity="0.9"/>
    <path d="M452 362 L452 420 C452 438 438 452 420 452 L344 452"
          stroke="#4c9be8" stroke-width="16" opacity="0.85"/>
    <circle cx="196" cy="60" r="7" fill="#fd9493" stroke="none" opacity="0.9"/>
    <circle cx="316" cy="452" r="7" fill="#4c9be8" stroke="none" opacity="0.85"/>
  </g>

  <!-- ambient glow behind visor -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="#6a4bd6" opacity="0.35" filter="url(#soft)"/>

  <!-- VISOR frame -->
  <path d="M96 256
    C96 222 130 205 182 203 L330 203
    C382 205 416 222 416 256
    C416 290 382 307 330 309 L182 309
    C130 307 96 290 96 256 Z"
    fill="url(#frame)"/>
  <!-- frame temple tabs -->
  <rect x="86" y="242" width="20" height="28" rx="8" fill="url(#frame)"/>
  <rect x="406" y="242" width="20" height="28" rx="8" fill="url(#frame)"/>

  <!-- lens -->
  <use href="#lensPath" fill="url(#lens)"/>

  <!-- vertical scan striations, clipped to lens -->
  <g clip-path="url(#lensClip)" stroke="#05060f" stroke-opacity="0.30" stroke-width="3">
    <line x1="140" y1="210" x2="140" y2="302"/>
    <line x1="164" y1="210" x2="164" y2="302"/>
    <line x1="188" y1="210" x2="188" y2="302"/>
    <line x1="212" y1="210" x2="212" y2="302"/>
    <line x1="236" y1="210" x2="236" y2="302"/>
    <line x1="260" y1="210" x2="260" y2="302"/>
    <line x1="284" y1="210" x2="284" y2="302"/>
    <line x1="308" y1="210" x2="308" y2="302"/>
    <line x1="332" y1="210" x2="332" y2="302"/>
    <line x1="356" y1="210" x2="356" y2="302"/>
    <line x1="372" y1="210" x2="372" y2="302"/>
  </g>
  <!-- bright scan line -->
  <g clip-path="url(#lensClip)">
    <rect x="118" y="250" width="276" height="4" fill="#bfe6ff" opacity="0.55"/>
  </g>

  <!-- specular glint along top of lens -->
  <path d="M138 228 C200 214 316 214 376 228"
        fill="none" stroke="url(#glint)" stroke-width="6" stroke-linecap="round"/>

  <!-- forge embers rising beneath the visor -->
  <g>
    <circle cx="256" cy="360" r="26" fill="url(#ember)"/>
    <circle cx="210" cy="388" r="16" fill="url(#ember)"/>
    <circle cx="304" cy="384" r="18" fill="url(#ember)"/>
    <g fill="#ffe0d6">
      <rect x="251" y="352" width="10" height="10" rx="2" transform="rotate(45 256 357)"/>
      <rect x="207" y="384" width="6" height="6" rx="1.5" transform="rotate(45 210 387)" opacity="0.9"/>
      <rect x="301" y="380" width="7" height="7" rx="1.5" transform="rotate(45 304 383)" opacity="0.9"/>
      <rect x="236" y="410" width="5" height="5" rx="1.5" transform="rotate(45 238 412)" opacity="0.7"/>
      <rect x="276" y="414" width="4" height="4" rx="1" transform="rotate(45 278 416)" opacity="0.6"/>
    </g>
  </g>

  <!-- vignette on top -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#vignette)"/>
</svg>
